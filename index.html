const CUR={"alien1": "La celebre bava dello Xenomorfo era in realtà lubrificante intimo (marca K-Y Jelly), mentre i tendini della mascella erano realizzati con preservativi sminuzzati. Le 130 uova nella stiva erano fatte di vetroresina e riempite con interiora di animali per renderle viscide al tatto.", "alien2": "Il Power Loader (l'esoscheletro giallo pilotato da Ripley) era un vero meccanismo idraulico funzionante, ma troppo pesante per reggersi da solo: durante le riprese era sospeso con dei cavi d'acciaio e un operatore nascosto dietro Sigourney Weaver ne manovrava i comandi.", "r2_d2": "Nel primo film del 1977 esistevano due versioni del droide: una radiocomandata a tre gambe per gli spostamenti veloci e una a due gambe con dentro l'attore Kenny Baker, che azionava le luci e i movimenti della testa dall'interno soffrendo un caldo tremendo.", "tie": "Il suono iconico dei caccia imperiali non proviene da un sintetizzatore, ma è il risultato della sovrapposizione tra il barrito di un giovane elefante e il rumore di un'auto che sfreccia sull'asfalto bagnato.", "interstellar": "Il robot TARS non era creato in computer grafica, ma era un enorme burattino meccanico pesante circa 90 kg, manovrato fisicamente sul set dall'attore Bill Irwin (che poi veniva cancellato digitalmente in post-produzione).", "oblivion": "La moto pieghevole trasportata sulla Bubbleship di Tom Cruise era una vera Honda CRF450X modificata, dotata di un telaio snodabile progettato appositamente per ripiegarsi e incastrarsi nella stiva del velivolo.", "ironman": "Nel primo film del 2008, l'armatura Mark III fu costruita realmente dalla Stan Winston Studio in fibra di vetro e metallo. Era talmente pesante e scomoda che Robert Downey Jr. faticava a muoversi, spingendo la Marvel a passare quasi totalmente alla CGI nei film successivi.", "godzilla": "Nel film originale del 1954, il costume del mostro pesava quasi 100 kg ed era fatto di cemento e gomma rigida a causa della carenza di lattice nel Giappone del dopoguerra. L'attore Haruo Nakajima riusciva a indossarlo solo per pochi minuti prima di rischiare lo svenimento.", "kong": "Per il capolavoro del 1933, Willis O'Brien costruì diversi modelli in stop-motion alti circa 45 cm con scheletri in acciaio snodabili rivestiti di pelliccia di coniglio. Ad ogni tocco degli animatori, la pelliccia lasciava delle impronte che davano l'impressione che \"respirasse\".", "ikran": "Per aiutare gli attori a simulare il volo sulle Banshee (Ikran), la produzione costruì enormi simulatori meccanici ispirati ai tori meccanici dei rodei, montati su bracci idraulici programmati per sincronizzarsi con i movimenti della telecamera virtuale.", "jurassic_park": "Il T-Rex animatronico a grandezza naturale pesava oltre 5 tonnellate. Quando pioveva sul set, la pelle in lattice assorbiva l'acqua diventando così pesante da far tremare e mandare in tilt i motori idraulici interni.", "jumanji": "La scatola del gioco da tavolo del film del 1995 era intagliata a mano in legno massello con meccanismi magnetici nascosti per far muovere le pedine da sole. L'oggetto originale di scena è stato venduto all'asta per oltre 60.000 dollari.", "delorean": "Furono usate tre diverse DeLorean DMC-12 per girare il primo film. Il celebre \"Flusso Canalizzatore\" era composto da semplici cavi elettrici colorati, raccordi industriali e tre lampadine stroboscopiche montate dentro una cassetta elettrica da parete.", "ford_falcon_xb_gt_interceptor": "In Fury Road (2015), la chitarra lanciafiamme suonata dal Doof Warrior era un oggetto reale, funzionante e pesantissimo (circa 60 kg), collegata a una vera bombola di gas e capace di sputare fiamme reali davanti alla macchina da presa.", "fastfurious": "La Toyota Supra arancione guidata da Brian O'Conner nel primo film aveva un motore da circa 550 cavalli, ma molti dei tubi colorati e dei manometri visibili nell'abitacolo erano solo finti componenti estetici incollati per fare scena.", "jason": "Jason Voorhees non indossa la sua celebre maschera da hockey fino al terzo capitolo (Week-end di terrore, 1982). Il supervisore agli effetti speciali Martin Jay Sadoff portò sul set una vecchia maschera dei Detroit Red Wings: piacque così tanto che ne fecero un calco allargato.", "leatherface": "La motosega utilizzata da Leatherface nel film del 1974 era una vera Poulan 245A funzionante. Per sicurezza durante le scene d'inseguimento, la catena era stata rimossa, ma l'attore Gunnar Hansen rischiò comunque più volte di ferirsi con la lama metallica calda.", "hellraiser": "La Configurazione del Lamento fu progettata da Simon Sayce in legno di mogano e ottone inciso. Sul set esistevano diverse versioni: alcune fisse, altre dotate di cerniere interne per aprirsi con un solo movimento della mano.", "chucky": "Per dare vita a Chucky nel 1988 servivano fino a nove burattinai contemporaneamente: alcuni muovevano gli arti tramite cavi, altri azionavano i radiocomandi per le espressioni facciali e gli occhi.", "saw": "Il pupazzo Billy fu costruito personalmente dal regista James Wan con cartapesta, palline da ping-pong per gli occhi e un vecchio triciclo per bambini, poiché il budget del primo film era bassissimo.", "hannibal": "La celebre museruola di Hannibal Lecter fu progettata da Ed Verreaux ispirandosi alle maschere da hockey e agli strumenti chirurgici, lasciando però scoperta la bocca per permettere ad Anthony Hopkins di recitare e mostrare i denti.", "harry_potter": "Daniel Radcliffe ha rotto circa 70-80 bacchette magiche durante le riprese dell'intera saga perché le usava continuamente come bacchette da batteria sulle gambe e sui tavoli tra un ciak e l'altro.", "cake": "La torta di compleanno regalata da Hagrid a Harry nel primo film (\"Happee Birthdae Harry\") era un vero dolce commestibile, ma fu realizzata in più copie identiche perché nelle prove e nei diversi ciak rischiava di sciogliersi sotto le luci calde del set.", "ring": "Per le riprese ravvicinate dell'Unico Anello (come quando cade nella neve), fu forgiato un anello gigante in ottone con un diametro di circa 15 centimetri, in modo da mantenere perfettamente a fuoco le incisioni in lingua nera.", "sanctum": "Per la Cappa della Levitazione furono realizzati circa 18 mantelli diversi: alcuni pesanti per le scene statiche, altri leggeri per svolazzare al vento e altri ancora rigidi su telai metallici per simulare i movimenti autonomi della cappa.", "lumiere": "Nella versione live-action del 2017, Ewan McGregor recitò sul set indossando una tuta per il motion capture con un copricapo dotato di tre lampadine LED montate sopra la testa, per permettere agli attori e ai tecnici delle luci di calcolare l'illuminazione esatta delle candele.", "wonka": "Nel classico del 1971, i biglietti d'oro erano stampati su una speciale lamina d'oro che si stropicciava facilmente al minimo tocco; ne furono stampati decine di esemplari di riserva perché gli attori bambini li rovinavano spesso durante le riprese.", "coraline": "Ogni maglione indossato dal pupazzo in stop-motion di Coraline fu lavorato a maglia a mano da Althea Crome usando aghi sottili quanto spilli da cucito, impiegando anche sei mesi per un singolo capo in miniatura.", "gremlin": "I pupazzi animatronici dei Mogwai e dei Gremlins erano talmente complessi, costosi e pieni di cavi elettrici delicati che, alla fine di ogni giornata di riprese, la sicurezza controllava i bagagliai delle auto della troupe per evitare furti.", "ghostbusters1": "Gli zaini protonici originali erano gusci di vetroresina pesanti circa 15-18 kg ciascuno, assemblati utilizzando veri componenti elettronici militari dismessi, tubi flessibili e parti di vecchi apparecchi radio.", "noisyboy": "Per il film furono costruiti 19 robot animatronici alti fino a 2,5 metri, dotati di articolazioni idrauliche e telecomandati in tempo reale sul ring per interagire fisicamente con Hugh Jackman.", "soap": "Le saponette rosa del film erano vere saponette prodotte artigianalmente e timbrate con il logo \"Paper Street Soap Company\". Ne furono fabbricate centinaia, molte delle quali furono poi distribuite come gadget promozionali alla stampa.", "batarang": "Nel film di Tim Burton del 1989, il costume di gomma rigida impediva a Michael Keaton di girare il collo. Per guardare a destra o a sinistra doveva ruotare tutto il busto, dando vita all'iconica \"mossa di Batman\".", "pirates": "La bussola di Jack Sparrow era un oggetto di scena modificato con un magnete nascosto sul fondo: un assistente fuori campo muoveva un altro magnete sotto il tavolo o dietro l'attore per far puntare l'ago nella direzione voluta dal regista.", "odissea": "Nell'adattamento diretto da Christopher Nolan (2026), l'elmo indossato da Benny Safdie nei panni di Agamennone ha fatto discutere perché sfoggia un design scuro, imponente e volutamente anacronistico (soprannominato dai fan \"bat-armatura\"), decorato sul retro con una serie di vertebre dorate.", "jack": "Nel film di Francis Ford Coppola con Robin Williams, gli oggetti scolastici e i mobili nella classe delle elementari furono costruiti in due scale diverse: una normale e una leggermente ridotta per far sembrare il protagonista ancora più gigantesco rispetto ai compagni.", "vhs": "Per girare le sequenze dei nastri maledetti nell'antologia horror V/H/S, la produzione usò realmente vecchie videocamere analogiche a nastro e registrazioni su VHS degradate fisicamente, anziché applicare filtri digitali in post-produzione.", "wall_e": "I tecnici della Pixar studiarono a lungo un vero binocolo militare e obiettivi fotografici vintage per progettare gli \"occhi\" di WALL·E, assicurandosi che potessero inclinarsi e mettere a fuoco con la meccanica autentica di un dispositivo ottico reale.", "obsession": "Nell'horror del 2026 diretto da Curry Barker, l'oggetto maledetto One Wish Willow (un rametto portafortuna da spezzare per esaudire un desiderio) fu acquistato per la finzione del film nel vero negozio esoterico The Green Man di Burbank, mandando in tilt le vendite del locale dopo l'uscita della pellicola.", "hersh_lauren_wk8_plant": "La vera bambola Annabelle conservata dai coniugi Warren è una semplice bambola di pezza Raggedy Ann, ma il regista James Wan decise di crearne una versione inquietante in porcellana perché riteneva che una bambola di stoffa non avrebbe fatto abbastanza paura al pubblico."};

return html`<div class="relative w-full h-full select-none"><div ref=${el} class="absolute inset-0"></div>${s.login&&html`<div class="absolute inset-0 z-50 grid place-items-center p-4" style=${{background:"rgba(16,20,29,.96)"}}><div class="w-full max-w-xl max-h-full overflow-y-auto p-6 rounded-2xl bg-black/70 border border-white/20 text-white grid gap-3"><div class="text-2xl font-black">🎬 CINEMA</div><div class="p-3 rounded-xl bg-white/10 border border-yellow-300/40 text-sm grid gap-1"><div class="font-black text-yellow-300">🎟️ Benvenuto al mio 18esimo!</div><div>Ogni <b>sala</b> è un <b>tavolo</b>. Ogni <b>film</b> è un <b>invitato</b>.</div><div class="text-white/80">Dillo alla cassiera: scrivi il titolo del <i>tuo</i> film e ti accompagna al tuo tavolo.</div></div><div class="text-sm text-white/80">Inserisci nome e cognome: saranno il tuo nome utente nel cinema.</div><input class="px-3 py-2 rounded-lg bg-white/10 border border-white/30 outline-none" placeholder="Nome" maxlength="15" value=${fn} onInput=${e=>setFn(e.target.value)}/><input class="px-3 py-2 rounded-lg bg-white/10 border border-white/30 outline-none" placeholder="Cognome" maxlength="15" value=${ln} onInput=${e=>setLn(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')go()}}/><button class=${btn+(fn.trim()&&ln.trim()?"":" opacity-40")} onClick=${go}>Entra nel cinema</button></div></div>`}
<div class="absolute top-0 inset-x-0 p-3 flex flex-wrap items-center gap-2 pointer-events-none" style=${{paddingTop:'calc(env(safe-area-inset-top,0px) + .75rem)'}}>
<div class="px-3 py-2 rounded-xl bg-black/60 text-white font-black pointer-events-auto">🎬 CINEMA${s.white?" · Exhibition Hall":(s.film>=0?" · Sala "+FILMS[s.film][4]+": "+FILMS[s.film][0]:"")}</div>
<button class=${btn+" pointer-events-auto"} onClick=${()=>{ss(o=>({...o,login:true}))}}>👥 ${(s.online||0)+1} online · ${s.name||""} ✏️</button>${s.room&&!s.seated&&html`<button class=${btn+" pointer-events-auto"} onClick=${()=>A().exit()}>🚪 Esci dalla sala</button>`}${!s.room&&!s.seated&&html`<button class=${btn+" pointer-events-auto"} onClick=${()=>A().hall()}>🖼️ Exhibition Hall</button>`}</div>
${s.missing&&s.missing.length>0&&html`<div class="absolute left-3 max-w-sm p-2 rounded-xl bg-red-900/85 text-white text-xs pointer-events-none" style=${{top:'calc(env(safe-area-inset-top,0px) + 4rem)'}}>⚠️ GLB non trovati: <b>${s.missing.join(', ')}</b><br/>Mettili in assets/models/ (o accanto a index.html) e apri da server locale.</div>`}
${s.white&&html`<div class="absolute right-3 top-32 px-3 py-2 rounded-xl bg-black/60 text-white text-xs flex items-center gap-2">📏 Scala modelli <input type="range" min=".5" max="1.6" step=".05" value=${s.ws||1} onInput=${e=>{const v=+e.target.value;ss(o=>({...o,ws:v}));A().wscale(v)}}/> ${(s.ws||1).toFixed(2)}×</div>`}${s.white&&html`<div class="absolute top-20 inset-x-0 text-center text-red-200 font-bold pointer-events-none">Exhibition Hall · modelli caricati ${s.hn||0}/${s.ht||0}</div>`}
${s.room&&!s.seated&&!s.white&&html`<div class="absolute top-20 inset-x-0 text-center text-cyan-200 font-bold pointer-events-none">Clicca su una poltrona con l’anello azzurro per sederti</div>`}
${TOUCH&&html`<div class="absolute left-4 z-10" style=${{bottom:'calc(env(safe-area-inset-bottom,0px) + 1rem)'}}><${Joy} onMove=${(x,y)=>A().joy(dz(x),dz(y))}/></div><div class="absolute right-4 z-10" style=${{bottom:'calc(env(safe-area-inset-bottom,0px) + 1rem)'}}><${Joy} onMove=${(x,y)=>A().look(dz(x),dz(y))}/></div>`}<div class="absolute left-3 grid gap-1 pointer-events-none" style=${{bottom:'calc(env(safe-area-inset-bottom,0px) + .75rem)',display:TOUCH?'none':undefined}}><div class="flex justify-center">${K('w')}</div><div class="flex gap-1">${K('a')}${K('s')}${K('d')}</div></div>
<div class="absolute right-3 flex flex-col gap-2 items-end" style=${{bottom:'calc(env(safe-area-inset-bottom,0px) + '+(TOUCH?'9rem':'.75rem')+')'}}>
${s.seated&&html`<button class=${btn} onClick=${()=>A().stand()}>🧍 Alzati</button>`}
${s.snack&&html`<div class="flex gap-2"><button class=${btn} onClick=${()=>A().drink()}>🥤 Bevi Bibita</button><button class=${btn} onClick=${()=>A().eat()}>🍿 Mangia Popcorn</button></div>`}</div>
${s.near&&html`<div class="absolute right-3 top-20 w-[min(22rem,calc(100%-1.5rem))] p-3 rounded-2xl bg-black/75 text-white backdrop-blur border border-white/20">
<div class="text-sm mb-2">🧑‍✈️ <b>Cassiera:</b> ${s.msg||"Benvenuto al Cinema! Quale film desideri vedere oggi?"}</div>
<div class="flex gap-2"><input value=${q} onInput=${e=>setQ(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')send()}} placeholder="Scrivi il titolo del film…" autocomplete="off" class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-white text-black text-sm font-semibold outline-none focus:ring-2 focus:ring-yellow-300"/><button class=${btn} onClick=${send}>Invia</button></div></div>`}

</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
